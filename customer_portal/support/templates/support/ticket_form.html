{% extends "base.html" %}
{% block title %}New Ticket — Sentinel{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold text-white mb-6">New Support Ticket</h1>
<div class="max-w-lg card rounded-2xl p-8">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-4">
        <label class="block text-xs text-slate-400 mb-1">{{ field.label }}</label>
        {{ field }}
      </div>
    {% endfor %}
    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg py-2 text-sm">Submit Ticket</button>
  </form>
</div>
{% endblock %}
