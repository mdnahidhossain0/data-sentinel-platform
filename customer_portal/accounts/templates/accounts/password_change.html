{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="max-w-md mx-auto card rounded-2xl p-8 mt-8">
  <h1 class="text-xl font-semibold text-white mb-2">Change Password</h1>
  
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-4">
        <label class="block text-xs text-slate-400 mb-1">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="text-red-400 text-xs mt-1">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg py-2 text-sm">Update Password</button>
  </form>
</div>
{% endblock %}
