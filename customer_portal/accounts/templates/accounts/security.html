{% extends "base.html" %}
{% block title %}Security — Sentinel{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold text-white mb-6">Security</h1>
<div class="max-w-md card rounded-2xl p-8 space-y-4">
  <div class="flex justify-between items-center text-sm">
    <span class="text-slate-300">Password</span>
    <a href="{% url 'accounts:password_change' %}" class="text-brand-500">Change password</a>
  </div>
  <div class="flex justify-between items-center text-sm border-t border-slate-700 pt-4">
    <span class="text-slate-300">Active sessions: {{ active_sessions }}</span>
    <form method="post" action="{% url 'accounts:logout_other_sessions' %}"><button class="text-brand-500">Log out other sessions</button></form>
  </div>
</div>
{% endblock %}
