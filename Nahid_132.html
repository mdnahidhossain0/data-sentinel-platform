
<!DOCTYPE html>
<html>
<head>
    <title>Nahid's Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h2>HTML Form</h2>
<h2>Student Registration Form</h2>

<form>
    <fieldset>
        <legend>Personal Information</legend>

        <label>Full Name:</label>
        <input type="text" placeholder="Enter your full name" required><br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter your email" required><br><br>

        <label>Password:</label>
        <input type="password" placeholder="Enter your password" required><br><br>

        <label>Phone:</label>
        <input type="tel" placeholder="Enter your phone number" required><br><br>

        <label>Age:</label>
        <input type="number" placeholder="Enter your age"><br><br>

        <label>Date of Birth:</label>
        <input type="date" required><br><br>
    </fieldset><br>

    <fieldset>
        <legend>Gender</legend>

        <input type="radio" name="gender">
        <label>Male</label>

        <input type="radio" name="gender">
        <label>Female</label>

        <input type="radio" name="gender">
        <label>Other</label>
    </fieldset><br>

    <fieldset>
        <legend>Skills</legend>

        <input type="checkbox">
        <label>HTML</label>

        <input type="checkbox">
        <label>CSS</label>

        <input type="checkbox">
        <label>JavaScript</label>
    </fieldset><br>

    <fieldset>
        <legend>Education Information</legend>

        <label>Department:</label>
        <select>
            <option>Select Department</option>
            <option>SWE</option>
            <option>CSE</option>
            <option>EEE</option>
            <option>BBA</option>
        </select> <br><br>

        <label>Semester:</label>
        <select>
            <option>1st</option>
            <option>2nd</option>
            <option>3rd</option>
            <option>4th</option>
            <option>5th</option>
            <option>6th</option>
            <option>7th</option>
            <option>8th</option>
        </select><br><br>

        <label>CGPA:</label>
        <input type="range" min="0" max="4" value="2"> 2
    </fieldset>

    <br>

    <fieldset>
        <legend>Additional Information</legend>

        <label>Website:</label>
        <input type="url"><br><br>

        <label>Favorite Color:</label>
        <input type="color"><br><br>

        <label>Upload Resume:</label>
        <input type="file"><br><br>

        <label>Preferred Time:</label>
        <input type="time"><br><br>

        <label>Select Month:</label>
        <input type="month"><br><br>

        <label>Select Week:</label>
        <input type="week"><br><br>
    </fieldset><br>

    <fieldset>
        <legend>Comments</legend>

        <label>Message:</label><br>
        <textarea rows="5" cols="30"
        placeholder="Enter your comments here..."></textarea>
    </fieldset><br>

    <input type="submit" value="Register">
</form>
</body>
</html>
