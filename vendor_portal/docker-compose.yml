services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-sentinel_vendor}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - vendor_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-sentinel_vendor}"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: sentinel_vendor_web
    env_file: .env
    environment:
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    networks:
      - default
      - sentinel_net
    command: >
      sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

volumes:
  vendor_db_data:

networks:
  sentinel_net:
    external: true
