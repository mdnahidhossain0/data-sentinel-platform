{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="glass rounded-xl p-6 max-w-md">
  <h1 class="text-lg font-semibold text-slate-100 mb-4">Change Password</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-4">
        <label class="block text-xs text-slate-400 mb-1">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="text-red-400 text-xs mt-1">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="bg-accent/90 hover:bg-accent text-ink-950 font-medium rounded-lg px-4 py-2 text-sm">Update Password</button>
  </form>
</div>
{% endblock %}
