{% extends "base.html" %}
{% block title %}{{ ticket.subject }} — Sentinel{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold text-white mb-1">{{ ticket.subject }}</h1>
<p class="text-sm text-slate-500 mb-6">{{ ticket.get_status_display }} · {{ ticket.get_priority_display }} priority · opened {{ ticket.created_at|date:"M j, Y" }}</p>
<div class="card rounded-2xl p-6 whitespace-pre-wrap text-sm text-slate-300">{{ ticket.message }}</div>
{% endblock %}
