{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="glass rounded-xl p-6 max-w-xl">
  <h1 class="text-lg font-semibold text-slate-100 mb-4">{{ title }}</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-4">
        <label class="block text-xs text-slate-400 mb-1">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="text-red-400 text-xs mt-1">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="bg-accent/90 hover:bg-accent text-ink-950 font-medium rounded-lg px-4 py-2 text-sm">Save</button>
  </form>
</div>
<style>input, select, textarea { width:100%; background:#12161f; border:1px solid #262c3a; border-radius:0.5rem; padding:0.5rem 0.75rem; color:#e2e8f0; }</style>
{% endblock %}
